
name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-web:
    name: Typecheck, tests and web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit and integration tests
        run: pnpm test:ci

      - name: Production build
        run: pnpm build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: pj-owl-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Android release APK
    runs-on: ubuntu-latest
    needs: validate-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0

          [ -z "$KEYSTORE_BASE64" ] && echo "::error::Missing secret: KEYSTORE_BASE64" && missing=1
          [ -z "$KEYSTORE_PASSWORD" ] && echo "::error::Missing secret: KEYSTORE_PASSWORD" && missing=1
          [ -z "$KEY_ALIAS" ] && echo "::error::Missing secret: KEY_ALIAS" && missing=1
          [ -z "$KEY_PASSWORD" ] && echo "::error::Missing secret: KEY_PASSWORD" && missing=1

          if [ "$missing" -eq 1 ]; then
            echo "Configure os secrets em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      - name: Configure Android minimum SDK
        run: pnpm cap:configure:android

      - name: Generate Android icon and splash resources
        run: pnpm dlx @capacitor/assets@4.0.0 generate --android

      - name: Sync Capacitor plugins and web assets
        run: pnpm exec cap sync android

      - name: Grant execute permission for Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/app-release.keystore"
          chmod 600 "$RUNNER_TEMP/app-release.keystore"
          test -s "$RUNNER_TEMP/app-release.keystore"

      - name: Build release APK (signed)
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/app-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release APK
        run: |
          echo "Verificando APK de release..."
          find android/app/build/outputs/apk -type f -name "*.apk"
          test -s android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: pj-owl-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
