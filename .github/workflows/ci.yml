
name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. VALIDACAO WEB
  # ============================================================
  validate-web:
    name: Typecheck, tests and web build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit and integration tests
        run: pnpm test:ci

      - name: Production build
        run: pnpm build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: pj-owl-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # 2. COMPILACAO ANDROID
  # ============================================================
  android-release:
    name: Android APK
    runs-on: ubuntu-latest
    needs: validate-web

    permissions:
      contents: read

    outputs:
      apk_artifact_name: ${{ steps.verify.outputs.apk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

      - name: Configure Android minimum SDK
        run: pnpm cap:configure:android

      - name: Generate Android icon and splash resources
        run: pnpm dlx @capacitor/assets@4.0.0 generate --android

      - name: Sync Capacitor plugins and web assets
        run: pnpm exec cap sync android

      - name: Grant execute permission for Gradle
        working-directory: android
        run: chmod +x gradlew

      # --------------------------------------------------------
      # Verifica se a execução exige uma Release oficial
      # --------------------------------------------------------
      - name: Check release conditions
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]] ||
             [[ "$EVENT_NAME" == "pull_request" && "$PR_BASE" == "main" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------
      # Verifica secrets de assinatura
      # --------------------------------------------------------
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then

            echo "enabled=true" >> "$GITHUB_OUTPUT"

          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Secrets de assinatura indisponíveis."
          fi

      # --------------------------------------------------------
      # Exige assinatura para publicação oficial
      # --------------------------------------------------------
      - name: Require signed APK for official release
        if: steps.release.outputs.required == 'true' && steps.signing.outputs.enabled != 'true'
        run: |
          echo "ERRO: A publicação oficial exige um APK assinado."
          echo "Configure os secrets de assinatura do Android."
          exit 1

      # --------------------------------------------------------
      # Decodifica keystore
      # --------------------------------------------------------
      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/app-release.keystore"
          chmod 600 "$RUNNER_TEMP/app-release.keystore"
          test -s "$RUNNER_TEMP/app-release.keystore"

      # --------------------------------------------------------
      # Compila APK assinado
      # --------------------------------------------------------
      - name: Build release APK (signed)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/app-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew --no-daemon assembleRelease

      # --------------------------------------------------------
      # APK sem assinatura para builds não oficiais
      # --------------------------------------------------------
      - name: Build release APK (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew --no-daemon assembleRelease

      # --------------------------------------------------------
      # Verifica APK gerado
      # --------------------------------------------------------
      - name: Verify release APK
        id: verify
        run: |
          set -e

          echo "Verificando APK de release..."

          find android/app/build/outputs/apk -type f -name "*.apk"

          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then

            APK="android/app/build/outputs/apk/release/app-release.apk"
            test -s "$APK"

            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

            test -n "$APKSIGNER"

            "$APKSIGNER" verify --verbose "$APK"

            echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
            echo "apk_name=pj-owl-android-release-signed" >> "$GITHUB_OUTPUT"

          else

            APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
            test -s "$APK"

            echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
            echo "apk_name=pj-owl-android-release-unsigned" >> "$GITHUB_OUTPUT"

          fi

      # --------------------------------------------------------
      # Armazena APK como artefato
      # --------------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify.outputs.apk_name }}
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # 3. PUBLICACAO AUTOMATICA DA GITHUB RELEASE
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - validate-web
      - android-release

    # Publica em pushes na main ou Pull Requests destinados à main.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Baixa aplicação web
      # --------------------------------------------------------
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: pj-owl-web-dist
          path: release-assets/web

      # --------------------------------------------------------
      # Baixa APK Android
      # --------------------------------------------------------
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android-release.outputs.apk_artifact_name }}
          path: release-assets/android

      # --------------------------------------------------------
      # Prepara arquivos para publicação
      # --------------------------------------------------------
      - name: Prepare release files
        run: |
          set -e

          mkdir -p release-assets

          echo "Compactando aplicação web..."

          cd release-assets/web
          zip -r ../PJ-OWL-Web.zip .
          cd ../..

          echo "Preparando APK Android..."

          APK=$(find release-assets/android -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "Erro: APK não encontrado."
            exit 1
          fi

          cp "$APK" release-assets/PJ-OWL-Android.apk

          echo "Arquivos preparados:"
          ls -lh release-assets/

          test -s release-assets/PJ-OWL-Web.zip
          test -s release-assets/PJ-OWL-Android.apk

      # --------------------------------------------------------
      # Publica GitHub Release
      # --------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          tag_name: v1.0.${{ github.run_number }}
          name: PJ OWL v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}

          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false

          overwrite_files: true
          fail_on_unmatched_files: true

          files: |
            release-assets/PJ-OWL-Web.zip
            release-assets/PJ-OWL-Android.apk
